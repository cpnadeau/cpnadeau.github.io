<script>
// Filter buttons on the Publications and News pages, and the "Research" menu
// highlight on the research pages. Text and data live in the .qmd and .yml files.
(function () {
  document.querySelectorAll("[data-filter-list]").forEach(function (box) {
    var list = document.getElementById(box.dataset.filterList);
    if (!list) return;
    var items = list.querySelectorAll(".row-item");
    var count = box.querySelector(".filter-count");
    var rows = box.querySelectorAll(".chip-row");
    var chosen = {};
    // On phones the filter buttons fold away behind one "Filter" button (see .filter-toggle in custom.scss).
    var panel = document.createElement("div");
    panel.className = "filter-panel";
    panel.id = box.dataset.filterList + "-filter-panel";
    rows[0].parentNode.insertBefore(panel, rows[0]);
    rows.forEach(function (row) { panel.appendChild(row); });
    var toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "filter-toggle";
    toggle.setAttribute("aria-controls", panel.id);
    toggle.setAttribute("aria-expanded", "false");
    box.insertBefore(toggle, panel);
    toggle.addEventListener("click", function () {
      var open = box.classList.toggle("open");
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    });
    // News: with no filter chosen, show only the newest year until "Show all years" is pressed.
    var latest = box.dataset.latest;
    var showAll = !latest;
    var moreBtn = document.querySelector('[data-show-all="' + box.dataset.filterList + '"]');
    if (moreBtn) {
      moreBtn.hidden = false;
      moreBtn.addEventListener("click", function () {
        showAll = !showAll;
        apply();
      });
    }
    function apply() {
      var shown = 0;
      var active = Object.keys(chosen).filter(function (key) { return chosen[key] !== "all"; }).length;
      var filtering = active > 0;
      toggle.textContent = active ? "Filter (" + active + " on)" : "Filter";
      var latestOnly = !showAll && !filtering;
      items.forEach(function (it) {
        var ok = Object.keys(chosen).every(function (key) {
          var want = chosen[key];
          return want === "all" || (it.dataset[key] || "").split(" ").indexOf(want) !== -1;
        });
        if (ok && latestOnly) ok = it.dataset.year === latest;
        it.hidden = !ok;
        if (ok) shown++;
      });
      if (count) {
        count.textContent = latestOnly
          ? "Showing " + latest + ": " + shown + " of " + items.length
          : "Showing " + shown + " of " + items.length;
      }
      if (moreBtn) {
        moreBtn.hidden = filtering;
        moreBtn.textContent = showAll ? "Show " + latest + " only" : "Show all " + items.length + " items";
        moreBtn.setAttribute("aria-expanded", showAll ? "true" : "false");
      }
    }
    rows.forEach(function (row) {
      var key = row.dataset.filterKey;
      chosen[key] = "all";
      row.hidden = false;
      row.addEventListener("click", function (e) {
        var btn = e.target.closest(".chip");
        if (!btn) return;
        chosen[key] = btn.dataset.value;
        row.querySelectorAll(".chip").forEach(function (b) {
          b.setAttribute("aria-pressed", b === btn ? "true" : "false");
        });
        apply();
      });
    });
    apply();
  });

  if (/\/research\//.test(location.pathname)) {
    var menu = document.getElementById("nav-menu-research");
    if (menu) menu.classList.add("active");
    var page = location.pathname.split("/").pop() || "index.html";
    document.querySelectorAll(".navbar .dropdown-item").forEach(function (a) {
      if ((a.getAttribute("href") || "").split("/").pop() === page) {
        a.classList.add("active");
        a.setAttribute("aria-current", "page");
      }
    });
  }
})();
</script>
